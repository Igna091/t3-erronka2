# The shop. ${SERVER_NAME} and ${HTTPS_PORT} come from the environment (compose.yaml).

ServerName ${SERVER_NAME}

# HTTP: nothing but a redirect to HTTPS, so passwords and the session cookie never travel in
# clear text
<VirtualHost *:8080>
    RewriteEngine On
    RewriteRule ^ https://${SERVER_NAME}:${HTTPS_PORT}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:8443>
    # Only src/public is on the web: the pages in includes/, conf.php and the profile photos
    # in storage/ can't be opened by URL
    DocumentRoot /var/www/app/public
    DirectoryIndex index.php

    SSLEngine on
    SSLCertificateFile /run/secrets/tls_crt
    SSLCertificateKeyFile /run/secrets/tls_key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLSessionTickets off

    # The browser's protections. The CSP allows nothing that isn't from this site, and no
    # script or inline style at all, so injected markup can't run (the pages need none).
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"

    <Directory /var/www/app/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        # index.php/anything is not index.php: no extra path for a page to echo back
        AcceptPathInfo Off

        # index.php is the only script that runs; any other PHP name is refused
        <FilesMatch "\.(php|phar|phtml|php[0-9])$">
            Require all denied
        </FilesMatch>
        <Files "index.php">
            Require all granted
        </Files>
        # Nor dotfiles
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    # Uploaded product pictures are only ever pictures: PHP is off in this folder
    <Directory /var/www/app/public/images>
        php_admin_flag engine off
        RemoveHandler .php .phar .phtml
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
