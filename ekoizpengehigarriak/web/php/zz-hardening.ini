; On top of php.ini-production (web/Dockerfile).

; Say nothing about PHP, and never show an error to a visitor: errors go to the container log
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; No remote files, no shell commands, and only the app's own folders
allow_url_fopen = Off
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl
open_basedir = /var/www/app:/tmp:/run/secrets/db_app_password

; Uploads: one picture of up to 2 MB per form (lib/images.php checks again)
file_uploads = On
upload_max_filesize = 2M
post_max_size = 3M
max_file_uploads = 1
; Redrawing a 4000 x 4000 picture needs room
memory_limit = 192M

; Sessions: only from the cookie, only ids PHP made itself, and the cookie's protections
; (lib/auth.php sets them again for the __Host- cookie)
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.gc_maxlifetime = 1800
