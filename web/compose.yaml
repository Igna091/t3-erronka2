# web01 stack (issue #18): Nginx -> PHP-FPM 8.5.12 running Laravel -> PostgreSQL 18, and the
# Python mailer (#22) sending the site's emails to Mailpit.
# Only nginx publishes ports to the network, plus Mailpit's demo inbox on 127.0.0.1. php, db and
# the mailer sit on internal networks with no route out.
# First run: bash scripts/dev-init.sh && docker compose up -d --build --wait   (see README.md)
#
# Images are pinned by digest. To bump one, change the tag and the digest together:
#   docker buildx imagetools inspect <image>:<tag>

name: guenaga-web

# Runtime baseline every service gets (plan: Docker, hardening baseline)
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s
  start_interval: 2s

x-php-build: &php-build
  context: .
  dockerfile: php/Dockerfile
  target: runtime

# Laravel settings shared by php and migrate. Secrets are passed as files (*_FILE), never as values.
x-laravel-env: &laravel-env
  APP_NAME: Guenaga Farmazeutika
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-https://localhost}
  APP_KEY_FILE: /run/secrets/app_key
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: guenaga
  HASH_DRIVER: argon2id
  SESSION_DRIVER: database
  SESSION_LIFETIME: "30"
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: strict
  # The __Host- prefix makes the browser reject the cookie unless it is Secure, host-only and Path=/
  SESSION_COOKIE: __Host-gfsid
  CACHE_STORE: database
  QUEUE_CONNECTION: sync

# Laravel's only writable paths besides the uploads volume, owned by www-data (uid 82 in the Alpine image)
x-laravel-tmpfs: &laravel-tmpfs
  - /tmp
  - /var/www/app/storage/framework/cache:uid=82,gid=82,mode=0700
  - /var/www/app/storage/framework/views:uid=82,gid=82,mode=0700
  - /var/www/app/storage/logs:uid=82,gid=82,mode=0700

services:
  nginx:
    <<: *hardening
    image: nginx:1.30.6@sha256:a7675fcee220f59b4a99f7098c06a0d5d999c2c0ee37c0211efb780536e5cb20
    # Unprivileged: listens on 8080/8443 inside the container, published as 80/443
    user: "101:101"
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./laravel/public:/var/www/app/public:ro
    tmpfs:
      - /tmp
    secrets: [tls_crt, tls_key]
    networks: [frontend, backend]
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://127.0.0.1:8080/"]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M, pids: 100 }

  php:
    <<: *hardening
    build: *php-build
    # Built here by default; on web01 the deploy script sets PHP_IMAGE to the release CI pushed to
    # GHCR (web/DEPLOY.md)
    image: ${PHP_IMAGE:-guenaga-web-php:dev}
    environment:
      <<: *laravel-env
      DB_USERNAME: app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
    volumes:
      # Profile photos on Laravel's private disk, outside public/
      - uploads:/var/www/app/storage/app
    tmpfs: *laravel-tmpfs
    secrets: [app_key, db_app_password]
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M, pids: 100 }

  # One-shot: applies Laravel's migrations and the shop catalogue (database/seeders, safe to
  # repeat) as the migrator role, the only role allowed DDL, then exits
  migrate:
    <<: *hardening
    build: *php-build
    image: ${PHP_IMAGE:-guenaga-web-php:dev}
    command: ["php", "artisan", "migrate", "--seed", "--force", "--no-interaction"]
    restart: "no"
    environment:
      <<: *laravel-env
      DB_USERNAME: migrator
      DB_PASSWORD_FILE: /run/secrets/db_migrator_password
    tmpfs: *laravel-tmpfs
    secrets: [db_migrator_password]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M, pids: 50 }

  db:
    <<: *hardening
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    user: postgres
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    environment:
      POSTGRES_DB: guenaga
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    volumes:
      - dbdata:/var/lib/postgresql
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999
      - /tmp
    secrets: [db_admin_password, db_migrator_password, db_app_password, db_mailer_password]
    networks: [backend]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "guenaga"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M, pids: 100 }

  # The Python mailer (#22): sends the emails the site queues in email_outbox. It logs in as the
  # mailer role, which can read only the outbox's content and update its delivery columns, and
  # sends over STARTTLS, trusting only the CA that signed Mailpit's certificate. Both its
  # networks are internal: no route out.
  mailer:
    <<: *hardening
    build:
      context: ../python
      target: runtime
    image: ${MAILER_IMAGE:-guenaga-web-mailer:dev}
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: guenaga
      DB_USERNAME: mailer
      DB_PASSWORD_FILE: /run/secrets/db_mailer_password
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SCHEME: smtp
      MAIL_CA_FILE: /run/secrets/mail_ca_crt
      MAIL_USERNAME: mailer
      MAIL_PASSWORD_FILE: /run/secrets/mail_password
      MAIL_FROM_ADDRESS: no-reply@guenaga.eus
      MAIL_FROM_NAME: Guenaga Farmazeutika
      MAILER_POLL_SECONDS: "5"
      LOG_LEVEL: info
    tmpfs:
      - /tmp
    secrets: [db_mailer_password, mail_ca_crt, mail_password]
    networks: [backend, mail]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-m", "mailer.heartbeat"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M, pids: 20 }

  # Demo only: catches every email instead of delivering it, and shows them at
  # http://localhost:8025. Its SMTP port is reachable only from the mailer, over STARTTLS and
  # with the password in secrets/mailpit_auth. Third-party image (axllent/mailpit), not a
  # Docker Official Image.
  # When secrets/mailpit_forward.yaml isn't empty, Mailpit also forwards a copy of every email
  # to the one inbox named there (README.md). With MAILPIT_DELIVER_TO set as well, it delivers
  # an email to its own recipient through the same login, but only when the address matches
  # that pattern, so the site can't be used to send mail to anyone at all.
  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    user: "65534:65534"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        if [ -s /run/secrets/mailpit_forward ]; then
        export MP_SMTP_FORWARD_CONFIG=/run/secrets/mailpit_forward;
        if [ -n "$$MAILPIT_DELIVER_TO" ]; then
        export MP_SMTP_RELAY_CONFIG=/run/secrets/mailpit_forward MP_SMTP_RELAY_MATCHING="$$MAILPIT_DELIVER_TO";
        fi;
        fi;
        exec /mailpit
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_SMTP_TLS_CERT: /run/secrets/mailpit_crt
      MP_SMTP_TLS_KEY: /run/secrets/mailpit_key
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH_FILE: /run/secrets/mailpit_auth
      MP_SMTP_DISABLE_RDNS: "true"
      # A regular expression for the addresses that get their emails for real, e.g.
      # '^(ane@gmail\.com|jon@gmail\.com)$' in web/.env. Empty: nobody does
      MAILPIT_DELIVER_TO: ${MAILPIT_DELIVER_TO:-}
      # mail_inbox gives Mailpit a route out, used only for the forwarding and delivering above;
      # its other outbound features stay off
      MP_DISABLE_VERSION_CHECK: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      # Against DNS rebinding: the inbox answers only to these Host headers
      MP_ALLOWED_HOSTS: localhost:${MAILPIT_PORT:-8025},127.0.0.1:${MAILPIT_PORT:-8025}
    tmpfs:
      # Mailpit keeps the emails in a temporary database here, so a restart empties the inbox
      - /tmp
    secrets: [mailpit_crt, mailpit_key, mailpit_auth, mailpit_forward]
    networks: [mail, mail_inbox]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/mailpit", "readyz"]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M, pids: 50 }

networks:
  frontend: {}
  backend:
    internal: true
    ipam:
      config:
        # db/pg_hba.conf only accepts the stack's roles from this subnet; keep them in sync
        - subnet: 172.30.10.0/24
  # The mailer and Mailpit only, so Mailpit can't reach db or php
  mail:
    internal: true
  # Only for publishing Mailpit's inbox port: Docker can't publish ports from internal networks
  mail_inbox: {}

volumes:
  dbdata: {}
  uploads: {}

# Created by scripts/dev-init.sh; on web01 the certificates come from the Infra TLS CA (#10)
secrets:
  app_key:
    file: ./secrets/app_key
  db_admin_password:
    file: ./secrets/db_admin_password
  db_migrator_password:
    file: ./secrets/db_migrator_password
  db_app_password:
    file: ./secrets/db_app_password
  db_mailer_password:
    file: ./secrets/db_mailer_password
  tls_crt:
    file: ./secrets/tls.crt
  tls_key:
    file: ./secrets/tls.key
  mail_password:
    file: ./secrets/mail_password
  mail_ca_crt:
    file: ./secrets/mail_ca.crt
  mailpit_crt:
    file: ./secrets/mailpit.crt
  mailpit_key:
    file: ./secrets/mailpit.key
  mailpit_auth:
    file: ./secrets/mailpit_auth
  mailpit_forward:
    file: ./secrets/mailpit_forward.yaml
