# Nginx for the Guenaga website (issues #18 and #20).
# Runs as the unprivileged nginx user (uid 101) on a read-only filesystem, so it listens on
# 8080/8443 inside the container and compose.yaml publishes them as 80/443.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Every writable path is on the /tmp tmpfs
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # Docker's DNS, so a recreated php container is found at its new address
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Access log to stdout, minus the container's own health checks
    map $remote_addr $loggable {
        127.0.0.1 0;
        default   1;
    }
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main if=$loggable;

    server_tokens off;
    sendfile on;
    keepalive_timeout 15s;

    # The site only takes forms and one profile photo
    client_max_body_size  3m;    # matches post_max_size in php.ini
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;

    # Rate limit POSTs to PHP per client IP; GETs are not limited. Loose enough for a shopping
    # session (basket, checkout, payment); Laravel adds tighter limits on payment attempts.
    map $request_method $post_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $post_limit_key zone=post:10m rate=30r/m;
    limit_req_status 429;

    # Plain HTTP only redirects to HTTPS
    server {
        listen 8080 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 8443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /run/secrets/tls_crt;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        root /var/www/app/public;

        include /etc/nginx/snippets/security-headers.conf;

        # No dotfiles (.git, .env, .htaccess)
        location ~ /\. {
            return 404;
        }

        # Static files under public/ are served directly; everything else goes to Laravel
        location / {
            try_files $uri /index.php$is_args$args;
        }

        # Laravel's front controller is the only PHP that ever runs
        location = /index.php {
            limit_req zone=post burst=20 nodelay;

            set $php_upstream php:9000;
            fastcgi_pass  $php_upstream;
            include       fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ \.php$ {
            return 404;
        }
    }
}
