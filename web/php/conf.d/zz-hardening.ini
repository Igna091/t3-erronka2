; Hardening on top of php.ini-production (issues #18 and #20, plan: website hardening checklist).
; Loaded by both PHP-FPM and the CLI in this image.

; Don't advertise PHP (removes the X-Powered-By header)
expose_php = Off

; Errors go to the log (container stderr), never to the browser
display_errors = Off
display_startup_errors = Off
log_errors = On
zend.exception_ignore_args = On

; No remote files or remote includes
allow_url_fopen = Off
allow_url_include = Off

; Scripts only reach the Laravel app (uploads are in its storage/app), /tmp and the secrets
open_basedir = /var/www/app/:/tmp/:/run/secrets/

; No process execution from PHP
disable_functions = exec,shell_exec,system,passthru,proc_open,popen

; Never guess which script to run from the request path
cgi.fix_pathinfo = 0

; Uploads: profile photos only
file_uploads = On
upload_tmp_dir = /tmp
upload_max_filesize = 2M
max_file_uploads = 2
post_max_size = 3M

; Resource limits per request
memory_limit = 128M
max_execution_time = 30
max_input_time = 30

; Sessions are Laravel's, not PHP's: their cookie flags are the SESSION_* settings in compose.yaml
