; PHP-FPM pool for the website (issue #18). Loaded after the image's www.conf and zz-docker.conf.
; Laravel reads its settings from the container environment (compose.yaml), so the image's
; clear_env = no stays; secrets are files under /run/secrets, never environment variables.
[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; Recycle workers regularly to cap memory growth
pm.max_requests = 500

; Only .php files ever run, whatever Nginx passes
security.limit_extensions = .php
