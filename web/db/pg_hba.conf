# PostgreSQL client authentication for the web01 stack (issue #18).
# Only the stack's own roles may connect over the network, only from the backend Docker
# network, and only with SCRAM passwords. The admin role (postgres) is reachable only from
# inside the db container. Keep the subnet in sync with networks.backend in compose.yaml.

# TYPE  DATABASE  USER      ADDRESS          METHOD
local   all       postgres                   peer
host    guenaga   migrator  172.30.10.0/24   scram-sha-256
host    guenaga   app       172.30.10.0/24   scram-sha-256
host    guenaga   mailer    172.30.10.0/24   scram-sha-256
host    all       all       0.0.0.0/0        reject
host    all       all       ::/0             reject
